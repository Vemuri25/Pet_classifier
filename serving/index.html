<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Breed Classifier</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1d1f; --muted:#6b6b70; --accent:#2f6fde; --bar:#dfe8fb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151517; --card:#1f1f23; --ink:#ececf0; --muted:#9a9aa3; --accent:#6d9bff; --bar:#26324d; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:640px; margin:40px auto; padding:0 16px; }
  h1 { font-size:1.6rem; margin:0 0 4px; } p.sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border-radius:14px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  #drop { border:2px dashed var(--muted); border-radius:12px; padding:32px; text-align:center; cursor:pointer; color:var(--muted); }
  #drop.hover { border-color:var(--accent); color:var(--accent); }
  #preview { max-width:100%; max-height:320px; border-radius:10px; display:none; margin:16px auto 0; }
  .row { margin:10px 0; } .label { display:flex; justify-content:space-between; font-size:.95rem; margin-bottom:4px; }
  .track { background:var(--bar); border-radius:6px; height:10px; overflow:hidden; }
  .fill { background:var(--accent); height:100%; width:0; transition:width .5s; }
  #meta { color:var(--muted); font-size:.85rem; margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>🐾 Pet Breed Classifier</h1>
  <p class="sub">EfficientNet fine-tuned on 37 cat &amp; dog breeds. Drop a photo to classify it.</p>
  <div class="card">
    <div id="drop">Click or drag an image here</div>
    <input id="file" type="file" accept="image/*" hidden>
    <img id="preview" alt="preview">
    <div id="results"></div>
    <div id="meta"></div>
  </div>
</main>
<script>
const drop = document.getElementById('drop'), input = document.getElementById('file');
drop.onclick = () => input.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('hover'); };
drop.ondragleave = () => drop.classList.remove('hover');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('hover'); if (e.dataTransfer.files[0]) send(e.dataTransfer.files[0]); };
input.onchange = () => input.files[0] && send(input.files[0]);

async function send(file) {
  const prev = document.getElementById('preview');
  prev.src = URL.createObjectURL(file); prev.style.display = 'block';
  const results = document.getElementById('results'), meta = document.getElementById('meta');
  results.innerHTML = '<p>Classifying…</p>'; meta.textContent = '';
  const fd = new FormData(); fd.append('file', file);
  try {
    const r = await fetch('/predict?top_k=5', { method:'POST', body:fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    results.innerHTML = data.predictions.map(p => `
      <div class="row"><div class="label"><span>${p.label}</span><span>${(p.probability*100).toFixed(1)}%</span></div>
      <div class="track"><div class="fill" data-w="${p.probability*100}"></div></div></div>`).join('');
    requestAnimationFrame(() => document.querySelectorAll('.fill').forEach(f => f.style.width = f.dataset.w + '%'));
    meta.textContent = `Inference: ${data.latency_ms} ms`;
  } catch (err) { results.innerHTML = `<p style="color:#d33">Error: ${err.message}</p>`; }
}
</script>
</body>
</html>
